image:
  repository: mts
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Stateless service — all durable state is in Postgres/Redis, so we scale by replica count.
replicaCount: 3

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1024Mi"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: mts.local

# HPA: scale on a custom concurrency metric (requests-in-flight) instead of CPU.
# LLM calls are I/O-bound, so CPU is a poor proxy. The honest scaling signal is
# "how many compile requests are queued / in flight per pod".
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetInflightPerPod: 4

pdb:
  enabled: true
  minAvailable: 2

# Non-secret config — surfaced as a ConfigMap.
config:
  MTS_ENV: production
  MTS_LOG_LEVEL: INFO
  MTS_REPAIR_LOOP_CAP: "3"
  MTS_BATTERY_RESERVE_MIN_PCT: "20.0"
  MTS_MIN_AGL_M: "20.0"
  MTS_LLM_MODEL: claude-sonnet-4-6
  LANGSMITH_TRACING: "true"
  LANGSMITH_PROJECT: mts-prod
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4317
  OTEL_SERVICE_NAME: mission-tasking-service

# Sensitive config — exposed through a Secret. In real deployments, point to an
# external secret manager (External Secrets Operator, Vault) rather than hand-
# editing these.
secrets:
  API_KEY: ""
  LANGSMITH_API_KEY: ""
  MTS_DATABASE_URL: ""
  MTS_CHECKPOINT_DATABASE_URL: ""
  REDIS_URL: ""

# Nightly eval CronJob.
evalCron:
  enabled: true
  schedule: "0 3 * * *"
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
