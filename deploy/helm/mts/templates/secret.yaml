# Sensitive values kept out of the image and out of ConfigMaps.
# In real deployments, prefer External Secrets Operator + a secrets manager.
apiVersion: v1
kind: Secret
metadata:
  name: mts-secrets
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: "{{ $v }}"
  {{- end }}
