# Minimal in-cluster Postgres (with PostGIS) + Redis for the kind dev cluster.
#
# This is NOT production-grade. In a real deployment, MTS's `MTS_DATABASE_URL`
# would point to a managed Postgres (RDS, Cloud SQL, etc.) and Redis would be
# Elasticache / Memorystore. The Helm chart's `secrets.MTS_DATABASE_URL` is
# the seam — switch it and nothing else has to change.
#
# Why bare manifests instead of bitnami sub-charts: zero extra moving parts,
# zero network fetch, fits on one screen. For kind it's plenty.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: default
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          env:
            - name: POSTGRES_USER
              value: mts
            - name: POSTGRES_PASSWORD
              value: mts
            - name: POSTGRES_DB
              value: mts
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mts"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
