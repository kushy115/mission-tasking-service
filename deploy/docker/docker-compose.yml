services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mts
      POSTGRES_USER: mts
      POSTGRES_PASSWORD: mts
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mts"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  otel-collector:
    image: otel/opentelemetry-collector:0.107.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3000:3000"]
    depends_on: [prometheus]

  mts:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      MTS_DATABASE_URL: postgresql+psycopg://mts:mts@postgres:5432/mts
      MTS_CHECKPOINT_DATABASE_URL: postgresql://mts:mts@postgres:5432/mts
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["8000:8000"]
    # Auto-recover from OOM kills so the client gets a real error response next
    # request instead of a hung connection.
    restart: on-failure
    # Explicit memory ceiling so failures are visible & predictable rather than
    # depending on Docker Desktop's default cgroup behavior.
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      otel-collector:
        condition: service_started

volumes:
  pgdata: {}
