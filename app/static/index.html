<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MTS — Mission Compiler</title>

  <!-- Leaflet for the map (CDN, no install needed) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2030;
      --panel-2: #232a3d;
      --border: #2d3548;
      --fg: #e6e9ef;
      --muted: #8a93a8;
      --accent: #4a9eff;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
    header .health { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    header .health .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    header .health .dot.ok { background: var(--ok); }
    header .health .dot.err { background: var(--err); }

    main { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px;
      height: calc(100vh - 50px); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; overflow: auto; }
    .panel h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--muted); }

    label { display: block; margin: 12px 0 4px; font-size: 12px; color: var(--muted); }
    select, input, textarea {
      width: 100%; background: var(--panel-2); border: 1px solid var(--border);
      color: var(--fg); padding: 8px 10px; border-radius: 6px; font: inherit;
    }
    textarea { resize: vertical; min-height: 90px; font-family: inherit; }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 10px; align-items: center; }
    .row > * { flex: 1; }
    button { background: var(--accent); color: white; border: 0; padding: 10px 14px;
      border-radius: 6px; cursor: pointer; font: inherit; font-weight: 500; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); }
    button.ok { background: var(--ok); color: #0f1419; }
    button.danger { background: var(--err); color: white; }

    .examples { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .examples button { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
      font-size: 11px; padding: 4px 8px; }
    .examples button:hover { color: var(--fg); border-color: var(--accent); }

    .right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    #map { flex: 1; min-height: 320px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel-2); }
    .leaflet-container { background: #1a2030; }

    .result { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; max-height: 40vh; overflow: auto; }
    .status-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; }
    .badge.ready { background: rgba(74, 222, 128, 0.15); color: var(--ok); }
    .badge.rejected { background: rgba(248, 113, 113, 0.15); color: var(--err); }
    .badge.clarification { background: rgba(251, 191, 36, 0.15); color: var(--warn); }
    .badge.error { background: rgba(138, 147, 168, 0.15); color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
    .stat { background: var(--panel-2); padding: 8px 10px; border-radius: 6px; }
    .stat .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.5px; }
    .stat .val { font-size: 16px; font-weight: 500; margin-top: 2px; }
    .reasoning { background: var(--panel-2); border-left: 3px solid var(--accent);
      padding: 10px 12px; border-radius: 4px; font-size: 13px; margin: 10px 0; line-height: 1.6; }
    .list { margin: 8px 0; padding-left: 18px; }
    .list li { margin: 4px 0; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }

    .empty { color: var(--muted); font-style: italic; padding: 20px; text-align: center; }

    .spinner { display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--accent); border-right-color: transparent;
      border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    code { background: var(--panel-2); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  </style>
</head>
<body>

<header>
  <h1>Mission Tasking Service</h1>
  <div class="health">
    <span id="health-text">checking...</span>
    <span id="health-dot" class="dot"></span>
  </div>
</header>

<main>
  <!-- LEFT: form -->
  <section class="panel">
    <h2>Compile a mission</h2>

    <label for="area">Operating area</label>
    <select id="area"></select>

    <label for="drone">Drone profile</label>
    <select id="drone"></select>

    <label for="battery">Starting battery: <span id="batteryVal">100</span>%</label>
    <input type="range" id="battery" min="20" max="100" value="100" />

    <label for="command">Natural-language command</label>
    <textarea id="command" placeholder="e.g. Patrol the yard perimeter at 60 meters with EO and return to base."></textarea>

    <div class="examples">
      <button data-cmd="Patrol the yard perimeter at 60 meters with EO and return to base.">perimeter</button>
      <button data-cmd="Hover above the center of the yard at 50 meters for two minutes and watch with EO.">loiter</button>
      <button data-cmd="Search the yard at 80 meters using a lawnmower pattern with EO.">lawnmower</button>
      <button data-cmd="Fly directly over the grain silo.">over NFZ</button>
      <button data-cmd="Go check something out there.">vague</button>
    </div>

    <div style="margin-top: 16px;">
      <button id="compile" style="width:100%;">Compile mission</button>
    </div>
  </section>

  <!-- RIGHT: map + result -->
  <section class="right">
    <div id="map"></div>
    <div id="result" class="result">
      <div class="empty">No mission yet — fill out the form and click <b>Compile</b>.</div>
    </div>
  </section>
</main>

<script defer>
window.addEventListener('DOMContentLoaded', () => {

  let map, areaLayer = null, planLayer = null;
  let currentAreas = [], currentDrones = [], currentPlan = null;

  // ---- elements
  const $ = (id) => document.getElementById(id);
  const areaSel = $('area'), droneSel = $('drone');
  const battery = $('battery'), batteryVal = $('batteryVal');
  const command = $('command'), compileBtn = $('compile');
  const resultEl = $('result');
  const healthText = $('health-text'), healthDot = $('health-dot');

  // ---- initialize map (centered roughly on first area when loaded)
  map = L.map('map', { zoomControl: true, attributionControl: false })
    .setView([40.72, -74.17], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19 }).addTo(map);

  // ---- battery slider
  battery.addEventListener('input', () => batteryVal.textContent = battery.value);

  // ---- examples → command
  document.querySelectorAll('.examples button').forEach(b =>
    b.addEventListener('click', () => command.value = b.dataset.cmd));

  // ---- health check (polled every 5s)
  async function ping() {
    try {
      const r = await fetch('/healthz');
      if (!r.ok) throw 0;
      healthText.textContent = 'service: ok';
      healthDot.className = 'dot ok';
    } catch {
      healthText.textContent = 'service: down';
      healthDot.className = 'dot err';
    }
  }
  ping(); setInterval(ping, 5000);

  // ---- load areas + drones into dropdowns
  async function loadAreas() {
    currentAreas = await (await fetch('/v1/areas')).json();
    areaSel.innerHTML = currentAreas.map(a =>
      `<option value="${a.area_id}">${a.area_id}</option>`).join('');
    drawAreaOnMap(currentAreas[0]);
    areaSel.addEventListener('change', () => {
      const a = currentAreas.find(x => x.area_id === areaSel.value);
      if (a) drawAreaOnMap(a);
    });
  }
  async function loadDrones() {
    currentDrones = await (await fetch('/v1/drones')).json();
    droneSel.innerHTML = currentDrones.map(d => {
      const endur = d.rated_endurance_s ? ` (${Math.round(d.rated_endurance_s/60)}min)` : '';
      return `<option value="${d.profile_id}">${d.profile_id}${endur}</option>`;
    }).join('');
  }

  // ---- draw area: boundary (blue), NFZs (red), home (green pin)
  function drawAreaOnMap(area) {
    if (areaLayer) map.removeLayer(areaLayer);
    if (planLayer) { map.removeLayer(planLayer); planLayer = null; }
    if (!area) return;
    const layers = [];
    layers.push(L.geoJSON(area.boundary, {
      style: { color: '#4a9eff', weight: 2, fillOpacity: 0.05 }
    }).bindTooltip(`Boundary — ceiling ${area.ceiling_m}m`));
    area.nfzs.forEach((nfz, i) => layers.push(L.geoJSON(nfz, {
      style: { color: '#f87171', weight: 2, fillOpacity: 0.2 }
    }).bindTooltip(`NFZ #${i+1}`)));
    layers.push(L.circleMarker([area.home_lat, area.home_lon], {
      radius: 6, color: '#4ade80', fillColor: '#4ade80', fillOpacity: 1
    }).bindTooltip('Home base'));
    areaLayer = L.layerGroup(layers).addTo(map);
    map.fitBounds(L.geoJSON(area.boundary).getBounds(), { padding: [30, 30] });
  }

  // ---- draw plan: each leg as a polyline + numbered markers
  function drawPlanOnMap(plan) {
    if (planLayer) map.removeLayer(planLayer);
    if (!plan.legs || !plan.legs.length) return;
    const legColors = { TRANSIT: '#4a9eff', SEARCH_PATTERN: '#a78bfa',
      LOITER: '#fbbf24', SENSOR_TASK: '#fbbf24', RETURN_TO_BASE: '#4ade80' };
    const layers = [];
    let wpCount = 0;
    plan.legs.forEach((leg, li) => {
      const pts = leg.geometry.map(w => [w.lat, w.lon]);
      if (pts.length >= 2) {
        layers.push(L.polyline(pts, {
          color: legColors[leg.leg_type] || '#fff', weight: 3, opacity: 0.9
        }).bindTooltip(`Leg ${li+1}: ${leg.leg_type}${leg.sensor_mode ? ' · ' + leg.sensor_mode : ''}`));
      }
      leg.geometry.forEach((w) => {
        wpCount++;
        layers.push(L.circleMarker([w.lat, w.lon], {
          radius: 4, color: legColors[leg.leg_type] || '#fff', fillOpacity: 1
        }).bindTooltip(`WP ${wpCount} · alt ${w.alt_m}m`));
      });
    });
    planLayer = L.layerGroup(layers).addTo(map);
  }

  // ---- compile
  compileBtn.addEventListener('click', async () => {
    const cmd = command.value.trim();
    if (!cmd) { command.focus(); return; }
    compileBtn.disabled = true;
    compileBtn.innerHTML = '<span class="spinner"></span> Compiling...';
    resultEl.innerHTML = '<div class="empty"><span class="spinner"></span> Asking the planner...</div>';

    try {
      const r = await fetch('/v1/missions:compile', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          command: cmd,
          area_id: areaSel.value,
          operator_clearance: 'STANDARD',
          drone_state: { drone_profile_id: droneSel.value, battery_pct: +battery.value }
        })
      });
      const body = await r.json();
      if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
      currentPlan = body.plan;
      renderResult(body);
      drawPlanOnMap(body.plan);
    } catch (e) {
      resultEl.innerHTML = `<div class="status-row"><span class="badge error">error</span></div>
        <pre style="color:var(--err); white-space:pre-wrap;">${escapeHtml(e.message)}</pre>`;
    } finally {
      compileBtn.disabled = false;
      compileBtn.textContent = 'Compile mission';
    }
  });

  // ---- result rendering
  function renderResult(body) {
    const p = body.plan;
    const badgeCls = { READY_FOR_APPROVAL: 'ready', REJECTED: 'rejected',
      NEEDS_CLARIFICATION: 'clarification' }[p.status] || 'error';
    let html = `
      <div class="status-row">
        <span class="badge ${badgeCls}">${p.status.replace(/_/g, ' ')}</span>
        <span style="color: var(--muted); font-size: 12px;">
          mission <code>${p.mission_id}</code> · ${body.repair_loops} repair loop(s)
        </span>
      </div>`;

    if (p.legs && p.legs.length) {
      html += `<div class="stats">
        <div class="stat"><div class="lbl">Legs</div><div class="val">${p.legs.length}</div></div>
        <div class="stat"><div class="lbl">Duration</div><div class="val">${(p.total_duration_s/60).toFixed(1)}m</div></div>
        <div class="stat"><div class="lbl">Battery used</div><div class="val">${p.total_battery_pct.toFixed(1)}%</div></div>
        <div class="stat"><div class="lbl">Reserve</div><div class="val">${p.battery_reserve_pct.toFixed(1)}%</div></div>
      </div>`;
    }

    if (p.reasoning_trace) {
      html += `<div class="reasoning">${escapeHtml(p.reasoning_trace)}</div>`;
    }

    if (p.rejection_reasons && p.rejection_reasons.length) {
      html += `<div><strong style="color: var(--err);">Rejection reasons:</strong>
        <ul class="list">${p.rejection_reasons.map(r => `<li>${escapeHtml(r)}</li>`).join('')}</ul></div>`;
    }
    if (p.clarification_questions && p.clarification_questions.length) {
      html += `<div><strong style="color: var(--warn);">Clarification questions:</strong>
        <ul class="list">${p.clarification_questions.map(q => `<li>${escapeHtml(q)}</li>`).join('')}</ul></div>`;
    }

    if (p.status === 'READY_FOR_APPROVAL') {
      html += `<div class="actions">
        <button class="ok" id="approve">Approve</button>
        <button class="secondary" id="verify">Verify (sim)</button>
        <button class="danger" id="reject">Reject</button>
      </div>`;
    }

    resultEl.innerHTML = html;

    // Bind dynamic buttons
    const approveBtn = $('approve'), verifyBtn = $('verify'), rejectBtn = $('reject');
    if (approveBtn) approveBtn.onclick = () => submitApproval(true);
    if (rejectBtn) rejectBtn.onclick = () => submitApproval(false);
    if (verifyBtn) verifyBtn.onclick = runVerify;
  }

  async function submitApproval(approve) {
    if (!currentPlan) return;
    try {
      const r = await fetch('/v1/missions:approve', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ mission_id: currentPlan.mission_id, approve, operator_note: '' })
      });
      const body = await r.json();
      if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
      const note = document.createElement('div');
      note.style.cssText = 'margin-top:10px; color:' + (approve ? 'var(--ok)' : 'var(--err)') + ';';
      note.textContent = approve ? `✓ Approved (${body.final_status})` : `✗ ${body.final_status}`;
      resultEl.appendChild(note);
    } catch (e) { alert('Approval failed: ' + e.message); }
  }

  async function runVerify() {
    if (!currentPlan) return;
    try {
      const r = await fetch(`/v1/missions/${currentPlan.mission_id}:verify`, { method: 'POST' });
      const body = await r.json();
      if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
      const summary = document.createElement('div');
      summary.style.cssText = 'margin-top:10px; padding:10px; background:var(--panel-2); border-radius:6px;';
      summary.innerHTML = `<strong>${body.flown_ok ? '✓' : '✗'} verifier:</strong>
        actual ${body.actual_duration_s.toFixed(0)}s · ${body.actual_battery_pct.toFixed(1)}% battery` +
        (body.deviations.length ? `<br><span style="color:var(--err)">deviations: ${body.deviations.join('; ')}</span>` : '');
      resultEl.appendChild(summary);
    } catch (e) { alert('Verify failed: ' + e.message); }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // ---- bootstrap
  loadAreas();
  loadDrones();
});
</script>
</body>
</html>
